<title>Country Stats Component Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .intro { display: grid; gap: 12px; padding-block: 26px 8px; }
  .toc { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 2px; margin-inline: -4px; padding-inline: 4px; }
  .toc a { flex: none; font-size: 12.5px; font-weight: 500; color: var(--ink-2); text-decoration: none; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); }
  .toc a:hover { color: var(--ink); border-color: var(--axis); }
  .sec { display: grid; gap: 14px; padding-block: 34px 6px; scroll-margin-top: 70px; }
  .sec-head { display: grid; gap: 4px; }
  .sec-head .lede { font-size: 13.5px; }
  .variants { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); align-items: start; }
  .variants.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); }
  .variants.tiles { grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
  .variant { display: grid; gap: 8px; min-width: 0; }
  .vhead { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .vname { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .vletter { font: 600 12px var(--font-num); color: var(--on-accent); background: var(--ink-2); min-width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; flex: none; }
  .vtitle { font-weight: 600; font-size: 13.5px; }
  .vbest { font-size: 12px; color: var(--muted); margin: 0; }
  .stack { display: grid; gap: 10px; }
  .row-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .hero-fig { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .hero-num { font-family: var(--font-ui); font-weight: 600; font-size: 52px; line-height: 1; letter-spacing: -0.03em; }
  .hero-num .unit { font-size: 16px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
  .profile .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
  .profile.hero .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--grid); padding-top: 12px; }
  .stat-v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
  .stat-r { font-size: 11.5px; color: var(--muted); }
  footer.note { padding-block: 26px 10px; }
  .nextlink { color: var(--accent); font-weight: 600; text-decoration: none; }
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="brand-mark">Country Stats</span><span class="badge">Our World in Data</span></div>
    <div id="mode"></div>
  </div>
</header>

<main class="wrap">
  <section class="intro" aria-labelledby="intro-h">
    <div class="eyebrow">Component kit</div>
    <h1 class="h1" id="intro-h">Every chart, every option</h1>
    <p class="lede">The building blocks of the dashboard, on live Our World in Data figures. Each has lettered options (A, B, C…) so we can refer to them by name, such as “Maps C” for the tile grid.</p>
    <nav class="toc" id="toc" aria-label="Sections"></nav>
  </section>
  <div id="sections"></div>
  <footer class="note" id="foot"></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="js/skins.js"></script>
<script src="data/owid.js"></script>
<script src="data/world-110m.js"></script>
<script src="js/core.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/links.js"></script>
<script src="js/gallery.js"></script>
